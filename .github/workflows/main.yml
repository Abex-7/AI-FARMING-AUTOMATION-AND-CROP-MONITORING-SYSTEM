name: CI/CD Pipeline - AI Farming System

# Pemicu pipeline ketika ada kode yang di-push ke branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Pengujian dan Build untuk Backend (Python FastAPI)
  backend-testing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.10'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        # Menginstall library utama seperti fastapi, uvicorn, boto3 (AWS), requests

    - name: Run Backend Unit Tests
      run: |
        # Simulasi menjalankan pengujian otomatis untuk integrasi FastAPI dan API (AWS IoT Core / Roboflow)
        pytest backend/tests/

  # Job 2: Pengujian dan Build untuk Frontend (React)
  frontend-testing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Run Frontend Lint & Tests
      run: |
        cd frontend
        npm test -- --watchAll=false

    - name: Build Frontend Production Artifact
      run: |
        cd frontend
        npm run build

  # Job 3: Simulasi Deployment Otomatis jika Test Lulus
  deploy-to-cloud:
    needs: [backend-testing, frontend-testing]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Deploy Production Code
      run: |
        echo "Menghubungkan ke AWS Cloud..."
        echo "Memperbarui layanan monitoring AI Farming..."
        echo "Deployment Berhasil Selesai!"
